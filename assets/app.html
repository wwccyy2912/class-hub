<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="{{TITLE}}"><meta name="class-hub-assets" content="{{ASSETS}}"><title>{{TITLE}}</title><link rel="icon" type="image/svg+xml" href="/icon.svg?v={{V_ICON}}"><link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png?v={{V_ICON}}"><link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v={{V_ICON}}"><link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png?v={{V_ICON}}"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v={{V_ICON}}"><link rel="manifest" href="/site.webmanifest"><meta name="theme-color" content="#2453c0"><script src="/theme.js?v={{V_THEME}}"></script><link rel="stylesheet" href="/style.css?v={{V_CSS}}"><script type="module" src="/app.js?v={{V_JS}}"></script></head><body><header><div class="bar"><a class="logo" href="/" aria-label="主站首页">1</a><a class="brand" href="/"><span id="brandName">{{NAME}}</span><small id="brandSub">{{SUB}}</small></a><nav id="nav" aria-label="主导航"></nav><div class="nav-drop" id="prefsDrop"><button class="icon-btn" id="prefsToggle" type="button" aria-expanded="false" aria-controls="prefsPanel" title="偏好设置" aria-label="偏好设置">⚙</button><div class="panel-drop" id="prefsPanel" role="dialog" aria-label="偏好设置"><h3>外观</h3><div class="segmented" id="themeSeg" role="group" aria-label="外观"><button type="button" data-theme-choice="auto">跟随系统</button><button type="button" data-theme-choice="light">浅色</button><button type="button" data-theme-choice="dark">深色</button></div><h3>播放</h3><div class="switch-row"><span>进入媒体页自动播放<small>打开音频/视频时自动开始，可能被浏览器拦截</small></span><button class="switch" type="button" role="switch" data-pref="autoplay" aria-checked="true" aria-label="进入媒体页自动播放"></button></div><div class="switch-row"><span>播完自动下一个<small>音频/视频播放结束后自动播下一项</small></span><button class="switch" type="button" role="switch" data-pref="autonext" aria-checked="true" aria-label="播完自动下一个"></button></div><h3>显示</h3><div class="switch-row"><span>显示快捷键提示<small>播放器下方显示快捷键说明</small></span><button class="switch" type="button" role="switch" data-pref="hints" aria-checked="true" aria-label="显示快捷键提示"></button></div><h3>网络与流量</h3><div class="segmented" id="netSeg" role="group" aria-label="网络与流量"><button type="button" data-net-choice="auto">自动</button><button type="button" data-net-choice="lite">省流</button><button type="button" data-net-choice="balanced">标准</button><button type="button" data-net-choice="quality">高清</button></div><p class="panel-note" id="netStatus">正在检测网络…</p></div></div></div></header><main id="app"><p role="status">正在加载班级资源…</p></main><footer><span id="footerLine">{{FOOTER}}</span><span>班级资料，集中查阅。</span></footer><div id="notice" role="status" aria-live="polite"></div></body></html>
